name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: cd codes && uv sync

      - name: Run Qiskit Aer checks
        run: |
          export MPLBACKEND=Agg
          bash scripts/run_all_scripts.sh
